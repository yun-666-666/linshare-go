<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11151b"><link rel="icon" href="/favicon.svg"><title>邻享 · 让分享近一点</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
<header><a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""> 邻享</a><button class="device-pill" id="deviceSettings" aria-label="设备与连接设置"><span class="status-dot"></span><span id="deviceName">正在连接</span></button></header>
<section class="composer" id="dropzone" aria-label="发布共享内容"><label class="visually-hidden" for="text">文字与链接</label><textarea id="text" rows="2" placeholder="输入文字或粘贴链接……"></textarea><div id="pending" class="pending" hidden></div><div class="compose-footer"><div class="pick-actions"><button id="pickFiles" class="light-button">＋ 文件</button><button id="pickPhotos" class="quiet">照片 / 视频</button><input id="files" type="file" multiple hidden><input id="photos" type="file" accept="image/*,video/*" multiple hidden></div><button id="publish" class="primary" disabled>共享 ↗</button></div><div class="compose-status"><span id="composeHint"></span><span id="textCount"></span></div><progress id="progress" max="100" value="0" hidden></progress></section>
<div class="sharing-controls"><button id="toggleSharing" class="chip" aria-pressed="true">共享已开启</button><button id="toggleAutoSave" class="chip" aria-pressed="false">自动保存：关</button><button id="manageDevices" class="quiet">内容管理</button></div><section class="shelf"><div class="section-title"><h2>共享 <span id="itemCount">0</span></h2><span id="peerCount">正在发现设备</span><button id="refresh" class="refresh" aria-label="刷新共享内容"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 0 1 15.4-6.4L21 7M21 3v4h-4"/><path d="M21 13a9 9 0 0 1-15.4 6.4L3 17M3 21v-4h4"/></g></svg></button></div><div class="search-bar"><label class="visually-hidden" for="search">搜索共享内容</label><div class="search-field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜索文字、文件或设备" autocomplete="off"><button id="searchClear" class="icon-button" aria-label="清空搜索" hidden>×</button></div></div><div id="kindFilter" class="kind-filter" role="group" aria-label="内容类型"><button type="button" data-kind="all" aria-pressed="true">全部类型</button><button type="button" data-kind="text" aria-pressed="false">文字</button><button type="button" data-kind="image" aria-pressed="false">图片</button><button type="button" data-kind="video" aria-pressed="false">视频</button><button type="button" data-kind="file" aria-pressed="false">文件</button></div><div class="filters" id="filters" role="group" aria-label="来源设备" hidden></div><div id="peerStatus"></div><div id="items" class="items"></div><div class="empty" id="empty">暂无共享，添加内容或连接附近设备。</div></section>
<footer><span id="syncStatus">正在连接</span><a class="desktop-license" href="/desktop-licenses.txt" target="_blank">开源许可</a></footer>
</main>
<dialog id="settings"><div class="dialog-head"><h2>设备与连接</h2><button id="settingsClose" class="icon-button" aria-label="关闭">×</button></div><label>本机名称<input id="nameInput" maxlength="60"></label><label class="switch-line"><span>允许附近设备查看我的共享</span><input id="enabledInput" type="checkbox"></label><label>共享码 <small>选填，留空即同网络可见</small><input id="codeInput" type="password" autocomplete="off" placeholder="不设置共享码"></label><label class="switch-line"><span>自动保存附近设备的文件</span><input id="autoSaveInput" type="checkbox"></label><div class="background-actions"><button id="backgroundSettings" class="light-button" hidden>允许熄屏后台共享</button><button id="vendorBackgroundSettings" class="light-button" hidden>应用耗电管理</button></div><button class="primary" id="saveSettings">保存设置</button><div class="settings-divider"></div><h3>连接另一台设备</h3><label>设备地址<input id="addressInput" placeholder="例如 192.168.1.20:48771"></label><label>对方共享码<input id="remoteCode" type="password" placeholder="没有则留空"></label><button id="connect" class="light-button">连接设备 ↗</button><p class="muted">本机地址</p><div id="addresses" class="addresses"></div></dialog>
<dialog id="contentManager" aria-labelledby="managerTitle"><div class="manager-header"><div class="dialog-head"><div><p class="eyebrow">共享空间</p><h2 id="managerTitle">内容管理</h2></div><button id="managerClose" class="icon-button" aria-label="关闭内容管理">×</button></div><p id="managerSummary" class="manager-summary"></p><div class="manager-toolbar"><span>离线记录自动过期</span><button id="clearOffline" class="light-button">清理离线记录</button></div></div><p class="manager-help">离线文件保留 30 秒，文字保留 10 分钟，过期后自动清理。清理记录不会删除已下载文件。隐藏设备或内容仅影响本机；暂停我的共享会让其他设备看不到该内容。</p><div id="deviceVisibility"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
