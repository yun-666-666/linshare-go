<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11151b"><link rel="icon" href="/favicon.svg"><title>邻享 · 让分享近一点</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
<header><a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""> 邻享</a><button class="device-pill" id="deviceSettings" aria-label="设备与连接设置"><span class="status-dot"></span><span id="deviceName">正在连接</span></button></header>
<section class="composer" id="dropzone" aria-label="发布共享内容"><label class="visually-hidden" for="text">文字与链接</label><textarea id="text" rows="2" placeholder="输入文字或粘贴链接……"></textarea><div id="pending" class="pending" hidden></div><div class="compose-footer"><div class="pick-actions"><button id="pickFiles" class="light-button">＋ 文件</button><button id="pickPhotos" class="quiet">照片 / 视频</button><input id="files" type="file" multiple hidden><input id="photos" type="file" accept="image/*,video/*" multiple hidden></div><button id="publish" class="primary" disabled>共享 ↗</button></div><div class="compose-status"><span id="composeHint">同一网络内可见 · 可拖入文件</span><span id="textCount"></span></div><progress id="progress" max="100" value="0" hidden></progress></section>
<div class="sharing-controls"><button id="toggleSharing" class="chip" aria-pressed="true">共享已开启</button><button id="toggleAutoSave" class="chip" aria-pressed="false">自动保存：关</button><button id="manageDevices" class="quiet">内容管理</button></div><section class="shelf"><div class="section-title"><h2>共享 <span id="itemCount">0</span></h2><span id="peerCount">正在发现设备</span><button id="refresh" class="refresh" aria-label="刷新共享内容"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 0 1 15.4-6.4L21 7M21 3v4h-4"/><path d="M21 13a9 9 0 0 1-15.4 6.4L3 17M3 21v-4h4"/></g></svg></button></div><div class="filters" id="filters"><button class="chip selected" data-filter="all">全部</button><button class="chip" data-filter="self">我的</button></div><div id="peerStatus"></div><div id="items" class="items"></div><div class="empty" id="empty">暂无共享，添加内容或连接附近设备。</div></section>
<footer><span id="syncStatus">正在连接</span><a class="desktop-license" href="/desktop-licenses.txt" target="_blank">开源许可</a></footer>
</main>
<dialog id="settings"><div class="dialog-head"><h2>设备与连接</h2><button id="settingsClose" class="icon-button" aria-label="关闭">×</button></div><label>本机名称<input id="nameInput" maxlength="60"></label><label class="switch-line"><span>允许附近设备查看我的共享</span><input id="enabledInput" type="checkbox"></label><label>共享码 <small>选填，留空即同网络可见</small><input id="codeInput" type="password" autocomplete="off" placeholder="不设置共享码"></label><label class="switch-line"><span>自动保存附近设备的文件</span><input id="autoSaveInput" type="checkbox"></label><p class="muted">保存到下载 / 邻享，按图片、视频、文件分类。已保存的内容不会重复下载。</p><div class="background-actions"><button id="backgroundSettings" class="light-button" hidden>允许熄屏后台共享</button><button id="vendorBackgroundSettings" class="light-button" hidden>应用耗电管理</button></div><p id="backgroundHelp" class="muted" hidden>若熄屏后离线，请在应用详情 → 耗电管理选择“完全允许后台行为”。部分手机还需要允许自启动。</p><button class="primary" id="saveSettings">保存设置</button><div class="settings-divider"></div><h3>连接另一台设备</h3><p class="muted">通常会自动发现。也可以输入对方的局域网地址。</p><label>设备地址<input id="addressInput" placeholder="例如 192.168.1.20:48771"></label><label>对方共享码<input id="remoteCode" type="password" placeholder="没有则留空"></label><button id="connect" class="light-button">连接设备 ↗</button><p class="muted">本机地址</p><div id="addresses" class="addresses"></div></dialog>
<dialog id="contentManager"><div class="dialog-head"><h2>内容管理</h2><button id="managerClose" class="icon-button" aria-label="关闭内容管理">×</button></div><p class="muted">关闭设备显示只影响本机；关闭我的内容共享会让其他设备看不到该条内容。离线文件和提示保留 30 秒，文字保留 10 分钟。</p><div id="deviceVisibility"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
